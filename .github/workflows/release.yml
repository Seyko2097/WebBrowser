# Publie les paquets .deb et .tar.gz quand un tag de version est poussé :
#   git tag v0.2.0 && git push origin v0.2.0
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: sh Packaging/build.sh
      - name: Vérifie l'installation du paquet
        run: |
          sudo apt-get install -y ./dist/webbrowser_*_amd64.deb
          webbrowser --version
          webbrowser paths
      - uses: actions/upload-artifact@v4
        with:
          name: paquets
          path: dist/*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
